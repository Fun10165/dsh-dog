<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 980" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4b5563" />
    </marker>
  </defs>
  <rect width="1460" height="980" fill="#f8fafc" />

  <text x="24" y="36" font-size="21" font-weight="700" fill="#111827">DoG v0.2 — one run flow</text>
  <text x="24" y="58" font-size="13" fill="#6b7280">Staged execution: failure settlement never stops unrelated verification. Green = human, purple = LLM agent, blue = program, orange = dev agent.</text>

  <!-- Swimlane headers -->
  <text x="40" y="100" font-size="13" font-weight="600" fill="#2f9e63">HUMAN</text>
  <text x="470" y="100" font-size="13" font-weight="600" fill="#7c6ce8">PLANNER / REVIEWER (LLM)</text>
  <text x="900" y="100" font-size="13" font-weight="600" fill="#3f7fd1">DoG CORE (program)</text>
  <text x="1250" y="100" font-size="13" font-weight="600" fill="#d97706">DEV AGENT</text>
  <line x1="24" y1="112" x2="1436" y2="112" stroke="#d1d5db" stroke-width="1.5" />

  <!-- 1 draft -->
  <rect x="40" y="130" width="220" height="52" rx="9" fill="#2f9e63" />
  <text x="150" y="152" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">1 · Human states objective</text>
  <text x="150" y="170" font-size="11" fill="#e8f5ee" text-anchor="middle">non-formal acceptance criteria</text>
  <line x1="260" y1="156" x2="460" y2="156" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)" />

  <rect x="470" y="130" width="300" height="52" rx="9" fill="#7c6ce8" />
  <text x="620" y="152" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">2 · Planning agent</text>
  <text x="620" y="170" font-size="11" fill="#efeaff" text-anchor="middle">decomposes objective → graph (LLM, isolated)</text>
  <line x1="770" y1="156" x2="890" y2="156" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)" />

  <rect x="900" y="130" width="260" height="52" rx="9" fill="#3f7fd1" />
  <text x="1030" y="152" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">dog_validate</text>
  <text x="1030" y="170" font-size="11" fill="#dbe9f8" text-anchor="middle">schema check + static rules (program)</text>
  <line x1="1030" y1="182" x2="1030" y2="210" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- 3 coverage review -->
  <rect x="470" y="216" width="300" height="52" rx="9" fill="#7c6ce8" />
  <text x="620" y="238" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">3 · Coverage reviewer</text>
  <text x="620" y="256" font-size="11" fill="#efeaff" text-anchor="middle">isolated review → approve / reject (LLM)</text>
  <line x1="620" y1="268" x2="620" y2="320" stroke="#4b5563" stroke-width="1.6" />
  <line x1="620" y1="320" x2="260" y2="320" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)" />

  <rect x="40" y="304" width="220" height="52" rx="9" fill="#2f9e63" />
  <text x="150" y="326" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">4 · Human confirms</text>
  <text x="150" y="344" font-size="11" fill="#e8f5ee" text-anchor="middle">graph becomes fixed standard</text>
  <line x1="150" y1="356" x2="150" y2="380" stroke="#4b5563" stroke-width="1.6" />
  <line x1="150" y1="380" x2="830" y2="380" stroke="#4b5563" stroke-width="1.6" />
  <line x1="830" y1="380" x2="830" y2="242" stroke="#4b5563" stroke-width="1.6" />
  <line x1="830" y1="242" x2="900" y2="242" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- compile -->
  <rect x="900" y="216" width="260" height="52" rx="9" fill="#3f7fd1" />
  <text x="1030" y="238" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">5 · dog_create</text>
  <text x="1030" y="256" font-size="11" fill="#dbe9f8" text-anchor="middle">compile · acceptance plans · contracts</text>
  <line x1="1030" y1="268" x2="1030" y2="296" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- 6 capture + revalidate -->
  <rect x="900" y="304" width="260" height="52" rx="9" fill="#3f7fd1" />
  <text x="1030" y="326" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">6 · capture</text>
  <text x="1030" y="344" font-size="11" fill="#dbe9f8" text-anchor="middle">snapshot (sha256, immutable)</text>
  <line x1="1030" y1="356" x2="1030" y2="384" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)" />

  <rect x="900" y="390" width="260" height="52" rx="9" fill="#3f7fd1" />
  <text x="1030" y="412" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">7 · revalidate_select</text>
  <text x="1030" y="430" font-size="11" fill="#dbe9f8" text-anchor="middle">GM digests → re-run vs inherited</text>
  <line x1="1030" y1="442" x2="1030" y2="470" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- 8 verify -->
  <rect x="900" y="476" width="260" height="88" rx="9" fill="#3f7fd1" />
  <text x="1030" y="498" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">8 · verify (scheduler)</text>
  <text x="1030" y="518" font-size="11" fill="#dbe9f8" text-anchor="middle">dependency gates · workspace pool</text>
  <text x="1030" y="536" font-size="11" fill="#dbe9f8" text-anchor="middle">deterministic → program (blue)</text>
  <text x="1030" y="552" font-size="11" fill="#dbe9f8" text-anchor="middle">agentic → Verifier Agent (LLM, isolated)</text>
  <line x1="1030" y1="564" x2="1030" y2="592" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- 9 recompute -->
  <rect x="900" y="598" width="260" height="52" rx="9" fill="#3f7fd1" />
  <text x="1030" y="620" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">9 · recompute</text>
  <text x="1030" y="638" font-size="11" fill="#dbe9f8" text-anchor="middle">propagate all affected paths (results)</text>
  <line x1="1030" y1="650" x2="1030" y2="678" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="1060" y="688" font-size="10" fill="#6b7280">failure settles results — unrelated leaves keep running</text>

  <!-- 10 human review (conditional) -->
  <rect x="40" y="704" width="220" height="52" rx="9" fill="#2f9e63" />
  <text x="150" y="726" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">10 · human_review (if needed)</text>
  <text x="150" y="744" font-size="11" fill="#e8f5ee" text-anchor="middle">failure · inconclusive · coverage</text>
  <line x1="260" y1="730" x2="810" y2="730" stroke="#4b5563" stroke-width="1.6" />
  <line x1="810" y1="730" x2="810" y2="640" stroke="#4b5563" stroke-width="1.6" />
  <line x1="810" y1="640" x2="900" y2="640" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- 11 report -->
  <rect x="900" y="704" width="260" height="52" rx="9" fill="#3f7fd1" />
  <text x="1030" y="726" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">11 · report</text>
  <text x="1030" y="744" font-size="11" fill="#dbe9f8" text-anchor="middle">evidence · inherited · threshold warning</text>
  <line x1="1030" y1="756" x2="1030" y2="784" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- 12 terminal + handoff -->
  <rect x="900" y="790" width="260" height="52" rx="9" fill="#3f7fd1" />
  <text x="1030" y="812" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">12 · terminal</text>
  <text x="1030" y="830" font-size="11" fill="#dbe9f8" text-anchor="middle">honest root state persisted</text>
  <line x1="1160" y1="816" x2="1240" y2="816" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)" />

  <rect x="1250" y="790" width="180" height="52" rx="9" fill="#d97706" />
  <text x="1340" y="812" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Dev agent</text>
  <text x="1340" y="830" font-size="11" fill="#fde8d0" text-anchor="middle">reads report · fixes · resubmits</text>

  <line x1="1340" y1="842" x2="1340" y2="890" stroke="#4b5563" stroke-width="1.6" />
  <line x1="1340" y1="890" x2="1030" y2="890" stroke="#4b5563" stroke-width="1.6" />
  <line x1="1030" y1="890" x2="1030" y2="842" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="1190" y="904" font-size="10" fill="#6b7280">new artifact + dog_run → next run</text>
</svg>
