<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 640" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4b5563" />
    </marker>
  </defs>
  <rect width="1460" height="640" fill="#f8fafc" />

  <text x="24" y="36" font-size="21" font-weight="700" fill="#111827">DoG v0.2 — data exchange links</text>
  <text x="24" y="58" font-size="13" fill="#6b7280">Every payload is validated by its schema before parsing or persistence. Fail-closed: invalid payload is rejected, never coerced.</text>

  <!-- Column headers -->
  <text x="60" y="96" font-size="12" font-weight="600" fill="#374151">Producer → Consumer</text>
  <text x="560" y="96" font-size="12" font-weight="600" fill="#374151">Payload</text>
  <text x="880" y="96" font-size="12" font-weight="600" fill="#374151">Format</text>
  <text x="1140" y="96" font-size="12" font-weight="600" fill="#374151">Schema (normative)</text>

  <line x1="24" y1="108" x2="1436" y2="108" stroke="#d1d5db" stroke-width="1.5" />

  <!-- Row 1: graph -->
  <rect x="40" y="124" width="300" height="56" rx="9" fill="#7c6ce8" />
  <text x="56" y="146" font-size="13" font-weight="600" fill="#ffffff">Planning agent → Compiler</text>
  <text x="56" y="164" font-size="11" fill="#efeaff">graph input (dog_validate / dog_create)</text>
  <line x1="340" y1="152" x2="540" y2="152" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="560" y="124" width="300" height="56" rx="9" fill="#eef2f7" stroke="#cbd5e1" />
  <text x="710" y="146" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Graph</text>
  <text x="710" y="164" font-size="11" fill="#475569" text-anchor="middle">nodes · contains · dependsOn</text>
  <line x1="860" y1="152" x2="1040" y2="152" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="880" y="124" width="220" height="56" rx="9" fill="#fefce8" stroke="#f59e0b" />
  <text x="990" y="146" font-size="13" font-weight="600" fill="#92400e" text-anchor="middle">JSON</text>
  <text x="990" y="164" font-size="11" fill="#92400e" text-anchor="middle">schemaVersion 0.2</text>
  <line x1="1100" y1="152" x2="1130" y2="152" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="1140" y="124" width="280" height="56" rx="9" fill="#dbeafe" stroke="#3b82f6" />
  <text x="1280" y="146" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">graph.schema.json</text>
  <text x="1280" y="164" font-size="11" fill="#1e3a8a" text-anchor="middle">addProps:false · kind branches · AST</text>

  <!-- Row 2: run -->
  <rect x="40" y="208" width="300" height="56" rx="9" fill="#3f7fd1" />
  <text x="56" y="230" font-size="13" font-weight="600" fill="#ffffff">Engine → Storage / status</text>
  <text x="56" y="248" font-size="11" fill="#dbe9f8">run record (persisted, read back)</text>
  <line x1="340" y1="236" x2="540" y2="236" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="560" y="208" width="300" height="56" rx="9" fill="#eef2f7" stroke="#cbd5e1" />
  <text x="710" y="230" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Run</text>
  <text x="710" y="248" font-size="11" fill="#475569" text-anchor="middle">state · goals · gmDigests · invocation</text>
  <line x1="860" y1="236" x2="1040" y2="236" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="880" y="208" width="220" height="56" rx="9" fill="#fefce8" stroke="#f59e0b" />
  <text x="990" y="230" font-size="13" font-weight="600" fill="#92400e" text-anchor="middle">JSON</text>
  <text x="990" y="248" font-size="11" fill="#92400e" text-anchor="middle">runs/&lt;runId&gt;.json</text>
  <line x1="1100" y1="236" x2="1130" y2="236" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="1140" y="208" width="280" height="56" rx="9" fill="#dbeafe" stroke="#3b82f6" />
  <text x="1280" y="230" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">run.schema.json</text>
  <text x="1280" y="248" font-size="11" fill="#1e3a8a" text-anchor="middle">incl. inherited + inheritedFrom</text>

  <!-- Row 3: verification -->
  <rect x="40" y="292" width="300" height="56" rx="9" fill="#3f7fd1" />
  <text x="56" y="314" font-size="13" font-weight="600" fill="#ffffff">Verifier exec → Storage</text>
  <text x="56" y="332" font-size="11" fill="#dbe9f8">verified result, append-only</text>
  <line x1="340" y1="320" x2="540" y2="320" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="560" y="292" width="300" height="56" rx="9" fill="#eef2f7" stroke="#cbd5e1" />
  <text x="710" y="314" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Verification</text>
  <text x="710" y="332" font-size="11" fill="#475569" text-anchor="middle">snapshotId · gmDigest · observation</text>
  <line x1="860" y1="320" x2="1040" y2="320" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="880" y="292" width="220" height="56" rx="9" fill="#fefce8" stroke="#f59e0b" />
  <text x="990" y="314" font-size="13" font-weight="600" fill="#92400e" text-anchor="middle">JSONL</text>
  <text x="990" y="332" font-size="11" fill="#92400e" text-anchor="middle">one object per line</text>
  <line x1="1100" y1="320" x2="1130" y2="320" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="1140" y="292" width="280" height="56" rx="9" fill="#dbeafe" stroke="#3b82f6" />
  <text x="1280" y="314" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">verification.schema.json</text>
  <text x="1280" y="332" font-size="11" fill="#1e3a8a" text-anchor="middle">schemaVersion 0.1 · sha256 refs</text>

  <!-- Row 4: runtime event -->
  <rect x="40" y="376" width="300" height="56" rx="9" fill="#3f7fd1" />
  <text x="56" y="398" font-size="13" font-weight="600" fill="#ffffff">Engine → Storage</text>
  <text x="56" y="416" font-size="11" fill="#dbe9f8">bounded diagnostics per goal</text>
  <line x1="340" y1="404" x2="540" y2="404" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="560" y="376" width="300" height="56" rx="9" fill="#eef2f7" stroke="#cbd5e1" />
  <text x="710" y="398" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Runtime event</text>
  <text x="710" y="416" font-size="11" fill="#475569" text-anchor="middle">phase · state · attempt · duration</text>
  <line x1="860" y1="404" x2="1040" y2="404" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="880" y="376" width="220" height="56" rx="9" fill="#fefce8" stroke="#f59e0b" />
  <text x="990" y="398" font-size="13" font-weight="600" fill="#92400e" text-anchor="middle">JSONL</text>
  <text x="990" y="416" font-size="11" fill="#92400e" text-anchor="middle">never verifier evidence</text>
  <line x1="1100" y1="404" x2="1130" y2="404" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="1140" y="376" width="280" height="56" rx="9" fill="#dbeafe" stroke="#3b82f6" />
  <text x="1280" y="398" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">runtime-event.schema.json</text>
  <text x="1280" y="416" font-size="11" fill="#1e3a8a" text-anchor="middle">phase enum incl. grounding_*</text>

  <!-- Row 5: report -->
  <rect x="40" y="460" width="300" height="56" rx="9" fill="#d97706" />
  <text x="56" y="482" font-size="13" font-weight="600" fill="#ffffff">Engine → Dev agent / CI</text>
  <text x="56" y="500" font-size="11" fill="#fde8d0">dog_status full response</text>
  <line x1="340" y1="488" x2="540" y2="488" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="560" y="460" width="300" height="56" rx="9" fill="#eef2f7" stroke="#cbd5e1" />
  <text x="710" y="482" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">CI report</text>
  <text x="710" y="500" font-size="11" fill="#475569" text-anchor="middle">rootState · evidence · inherited · warning</text>
  <line x1="860" y1="488" x2="1040" y2="488" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="880" y="460" width="220" height="56" rx="9" fill="#fefce8" stroke="#f59e0b" />
  <text x="990" y="482" font-size="13" font-weight="600" fill="#92400e" text-anchor="middle">JSON</text>
  <text x="990" y="500" font-size="11" fill="#92400e" text-anchor="middle">machine-readable</text>
  <line x1="1100" y1="488" x2="1130" y2="488" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="1140" y="460" width="280" height="56" rx="9" fill="#dbeafe" stroke="#3b82f6" />
  <text x="1280" y="482" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">report.schema.json</text>
  <text x="1280" y="500" font-size="11" fill="#1e3a8a" text-anchor="middle">revalidated / inherited arrays</text>

  <!-- Bottom note: content-addressed flows -->
  <rect x="40" y="540" width="1380" height="70" rx="10" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="60" y="562" font-size="13" font-weight="600" fill="#334155">Content-addressed byte flows (no schema; integrity by hash)</text>
  <text x="60" y="582" font-size="12" fill="#475569">Artifact snapshot: bind path → artifact store (sha256 bytes + manifest JSON)</text>
  <text x="60" y="598" font-size="12" fill="#475569">Evidence objects: Verifier Agent → artifact store (bytes + sha256 references in verification record)</text>
  <text x="60" y="612" font-size="12" fill="#475569">Grounding material: extractor → engine (normalized JSON → gmDigest, schema declared by extractor)</text>
</svg>
